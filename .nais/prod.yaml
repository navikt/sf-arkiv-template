apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: sf-arkiv
  namespace: template
  labels:
    team: template
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "256M"
spec:
  image: '{{ image }}'
  replicas:
    min: 1
    max: 1
  liveness:
    path: /internal/isAlive
  readiness:
    path: /internal/isReady
  prometheus:
    enabled: true
    path: /internal/prometheus
  resources:
    limits:
      memory: 3Gi
    requests:
      cpu: 100m
      memory: 512Mi
  gcp:
    sqlInstances:
      - type: POSTGRES_18
        tier: db-custom-1-3840
        diskAutoresize: true
        databases:
          - name: arkiv
  ingresses:
    - "https://sf-arkiv-template.intern.nav.no"
    - "https://sf-arkiv-template.nav.no"
  azure:
    application:
      enabled: true
  accessPolicy:
    inbound:
      rules:
        - application: salesforce
          namespace: teamcrm
          cluster: prod-external
  envFrom:
    - configmap: sf-arkiv-template